# main が変わった時に、data/yado.json からページを作って GitHub Pages に公開する。
name: ページの公開

on:
  push:
    branches: [main]
    paths:
      - "data/yado.json"
      - "site/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  schedule:
    # 毎日 0:05（日本時間）に作り直す。「新着」の印とサイトマップの日付を、その日に合わせるため
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 共有カードを作る道具（Pillow と日本語のフォント）
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
          python3 -m pip install -q pillow
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
